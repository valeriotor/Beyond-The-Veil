description='''
In Beyond the Veil, you take on the mantle of an academic: a Seeker of Truth. Via rigorous experimentation, exploration, and dialogue with the people of the world, you may breach mankind's preconceived notions of reality... but could some veils be better left unopened? Beyond the Veil is inspired by the works of H.P. Lovecraft, and turns the player into both victim and perpetrator of cruel indifference.'''

